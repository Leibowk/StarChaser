<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  window.initMap = function() {
    const osm = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, attribution: '© OpenStreetMap contributors' }
    );

    if (!window.__API_URL__) {
      console.error('API_URL not set');
      return;
    }

    const light2024 = L.tileLayer(
      `${window.__API_URL__}/tiles/tiles2024/tile_{z}_{x}_{y}.png`,
      {
        minZoom: 2,
        maxNativeZoom: 8,
        maxZoom: 19,
        tileSize: 1024,
        zoomOffset: -2,
        opacity: 0.5
      }
    );

    const map = L.map('map', {
      center: [48.75, -122.52],
      zoom: 9,
      layers: [osm, light2024]
    });

    L.control.layers({ OpenStreetMap: osm }, { '2024 Light Pollution': light2024 }).addTo(map);

    const parkLayer = L.layerGroup().addTo(map);

    window.renderSites = function (sites) {
      parkLayer.clearLayers();
      sites.forEach(site => {
        const marker = L.circleMarker([site.latitude, site.longitude], {
          radius: 6,
          color: '#2E8B57',
          fillOpacity: 0.9
        });

        const lp = site.lightPollution;

        const popupHtml = `
          <h3>${site.name}</h3>
          <p>${site.description}</p>
          <b>Light Pollution</b><br/>
          Zone: ${lp?.lpZone ?? 'N/A'}<br/>
          Index: ${lp?.lpIndex?.toFixed(3) ?? 'N/A'}<br/>
          mag/arcsec²: ${lp?.magArcSec?.toFixed(2) ?? 'N/A'}<br/>
          <button onclick='window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({ type: "siteClick", site: ${JSON.stringify(site.id)} }))'>
            View Details
          </button>
        `;
        marker.bindPopup(popupHtml);
        marker.addTo(parkLayer);
      });
    };
  };
</script>
</body>
</html>
